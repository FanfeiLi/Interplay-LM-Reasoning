# GSM-Infinity Mamba-2 (SSM) — 400M
# Architecture: dim=1024, n_layers=150, n_heads=16, state_dim=128, conv_size=4
# ~399M params (weight_tying=True) / ~401M (weight_tying=False)
# Data: 10B tokens, op range 2-10, seq_len=2048
# Hardware: 8x H100 GPUs
# Effective batch: 8/GPU × 8 accum × 8 GPUs × 2048 tokens ≈ 1M tokens/step

name: "mamba_400M_gsm"
steps: 10_000
seed: 42
grad_acc_steps: 8

optim:
  lr: 1.0e-4
  weight_decay: 0.1
  warmup: 500
  lr_min_ratio: 0.3
  clip: 1.0

distributed:
  fsdp_type: full_shard
  compile: true
  model_dtype: bf16
  matmul_allow_tf32: false
  selective_activation_checkpointing: true
  tp_size: 1

model:
  dim: 1024
  n_layers: 150
  n_heads: 16
  n_groups: 1
  state_dim: 128
  conv_size: 4
  dt_bias: false
  D_has_head_dim: false
  weight_tying: true
  init_args:
    A_init_min: 0.01
    A_init_max: 2

data:
  root_dir: null
  sources:
    gsm_infinity: 100.0
  batch_size: 8
  prefetch_size: 64
  seq_len: 2048
  n_views: 2
  load_async: true
  add_bos: true
  add_eos: true
  tokenizer:
    name: hf
    path: null

checkpoint:
  dump:
    every: 500
    keep: 25
  eval:
    every: 1000
    keep: 10

logging:
  freq: 10
