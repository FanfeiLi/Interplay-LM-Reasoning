# GSM-Infinity Multi-Token Prediction (MTP) Transformer — 400M
# Architecture: dim=1024, n_layers=35, n_heads=16, n_kv_heads=4, n_future_head=3
# ~406M params (3 extra prediction heads on top of standard transformer)
# Data: 10B tokens, op range 2-10, seq_len=2048, n_views=4 (must equal n_future_head+1)
# Hardware: 8x H100 GPUs
# Effective batch: 8/GPU × 8 accum × 8 GPUs × 2048 tokens ≈ 1M tokens/step

name: "mtp_400M_gsm"
steps: 10_000
seed: 42
grad_acc_steps: 8

optim:
  lr: 1.0e-4
  weight_decay: 0.1
  warmup: 500
  lr_min_ratio: 0.3
  clip: 1.0

distributed:
  fsdp_type: full_shard
  compile: true
  model_dtype: bf16
  matmul_allow_tf32: false
  selective_activation_checkpointing: true
  tp_size: 1

model:
  dim: 1024
  n_layers: 35
  n_heads: 16
  n_kv_heads: 4
  n_future_head: 3
  attn_impl: sdpa
  mask: causal

data:
  root_dir: null
  sources:
    gsm_infinity: 100.0
  batch_size: 8
  prefetch_size: 64
  seq_len: 2048
  n_views: 4
  load_async: true
  add_bos: true
  add_eos: true
  tokenizer:
    name: hf
    path: null

checkpoint:
  dump:
    every: 500
    keep: 25
  eval:
    every: 1000
    keep: 10

logging:
  freq: 10
