# Dr. GSPO + Ent-Cov training config for ID (in-distribution, op=2-10) dataset
# "Dr." = no std normalization of advantages (norm_adv_by_std_in_grpo: false)
# Uses seq-mean-token-sum aggregation (proven best in verl_custom experiments)
# Ent-Cov alleviates entropy decay during training
#
# Key parameters from verl_custom best run (run_ent_cov_gspo_alpha_qwen25math_7b.sh):
#   ent_cov_alpha: 0.15 (gentle shaping), cosine schedule decaying to 0.0
#   rollout IS enabled with threshold 5.0

hydra:
  searchpath:
    - file://verl/trainer/config

defaults:
  - ppo_trainer
  - _self_

algorithm:
  adv_estimator: grpo
  use_kl_in_reward: false
  norm_adv_by_std_in_grpo: false
  rollout_is_threshold: 5.0
  rollout_is: true

data:
  train_files:
    - data/rl_finetune/train/id/id_200k.jsonl
  val_files:
    - data/composition_hf/test_small/op2-200.jsonl
    - data/composition_hf/test_small/op3-200.jsonl
    - data/composition_hf/test_small/op4-200.jsonl
    - data/composition_hf/test_small/op5-200.jsonl
    - data/composition_hf/test_small/op6-200.jsonl
    - data/composition_hf/test_small/op7-200.jsonl
    - data/composition_hf/test_small/op8-200.jsonl
    - data/composition_hf/test_small/op9-200.jsonl
    - data/composition_hf/test_small/op10-200.jsonl
    - data/composition_hf/test_small/op11-200.jsonl
    - data/composition_hf/test_small/op12-200.jsonl
    - data/composition_hf/test_small/op13-200.jsonl
    - data/composition_hf/test_small/op14-200.jsonl
    - data/composition_hf/test_small/op17-200.jsonl
    - data/composition_hf/test_small/op18-200.jsonl
    - data/composition_hf/test_small/op19-200.jsonl
    - data/composition_hf/test_small/op20-200.jsonl
  tokenizer:
  train_batch_size: 1024
  max_prompt_length: 1024
  max_response_length: 1024
  id_max_op: 10
  filter_overlong_prompts: true
  truncation: error
  custom_cls:
    path: verl/dataset.py
    name: CustomRLHFDataset

custom_reward_function:
  path: verl/dataset.py
  name: compute_score

actor_rollout_ref:
  model:
    path: /fast/fli/Interplay-LM-Reasoning/LLaMA-Factory/saves/gsm_infinity/pt_op2-10_10B_alltemps_20260213_233838
    enable_gradient_checkpointing: true
    use_remove_padding: true
  actor:
    optim:
      lr: 1e-6
    ppo_mini_batch_size: 256
    ppo_micro_batch_size_per_gpu: 16
    use_kl_loss: false
    kl_loss_coef: 0.0
    entropy_coeff: 0.0
    clip_ratio: 0.0003
    clip_ratio_low: 0.0003
    clip_ratio_high: 0.0004
    loss_agg_mode: seq-mean-token-sum
    policy_loss:
      loss_mode: gspo_ent_cov
      ent_cov_alpha: 0.15
      ent_cov_alpha_end: 0.0
      ent_cov_schedule: cosine
      ent_cov_warmup_ratio: 0.1
      ent_cov_delta_h_tgt: 0.0
      ent_cov_eta: 1.0
      ent_cov_lambda_clip: 5.0
      ent_cov_eps: 1e-5
    fsdp_config:
      param_offload: false
      optimizer_offload: false
  rollout:
    name: vllm
    gpu_memory_utilization: 0.6
    n: 8
    tensor_model_parallel_size: 1
    log_prob_micro_batch_size_per_gpu: 16
    temperature: 1.0
    top_p: 1.0
    top_k: -1
    val_kwargs:
      do_sample: true
      n: 128
      temperature: 0.7
      top_p: 1.0
      top_k: -1
  ref:
    log_prob_micro_batch_size_per_gpu: 16
    fsdp_config:
      param_offload: true

trainer:
  critic_warmup: 0
  logger:
    - console
    - wandb
    - local_json
  project_name: gsm-infinity-rl
  experiment_name: dr_gspo_ent_cov_id
  default_local_dir: results/gsm_infinity_rl/dr_gspo_ent_cov_id
  n_gpus_per_node: 8
  nnodes: 1
  save_freq: 20
  test_freq: 20
  log_val_generations: 100
  total_epochs: 2

