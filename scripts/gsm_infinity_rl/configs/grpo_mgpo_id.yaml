# GRPO + MGPO training config for ID (op=2-10) dataset
# MGPO = MaxEnt-Guided advantage reweighting: focuses learning on prompts with
#        mixed success rates (p_c ≈ 0.5) while downweighting "too easy" or "too hard" prompts.
#
# MGPO reweighting formula:
#   D_ME(p_c || 0.5) = p_c * log(p_c/0.5) + (1-p_c) * log((1-p_c)/0.5)
#   w_ME = exp(-mgpo_lambda * D_ME)
#   A'_i = w_ME * A_i
#
# Hyperparameters from paper: global batch 1024, max prompt/response 1024, 2 epochs
# Actor LR 1e-6, PPO mini-batch 256, micro-batch 16/GPU, KL coef 1e-3 (low-var KL), zero entropy

hydra:
  searchpath:
    - file://verl/trainer/config

defaults:
  - ppo_trainer
  - _self_

algorithm:
  adv_estimator: grpo_mgpo
  mgpo_lambda: 3.0  # Controls sharpness of reweighting; higher = more focus on p_c ≈ 0.5
  use_kl_in_reward: false
  norm_adv_by_std_in_grpo: true

data:
  train_files:
    - data/rl_finetune/train/id/id_200k.jsonl
  val_files:
    - data/composition_hf/test_small/op2-200.jsonl
    - data/composition_hf/test_small/op3-200.jsonl
    - data/composition_hf/test_small/op4-200.jsonl
    - data/composition_hf/test_small/op5-200.jsonl
    - data/composition_hf/test_small/op6-200.jsonl
    - data/composition_hf/test_small/op7-200.jsonl
    - data/composition_hf/test_small/op8-200.jsonl
    - data/composition_hf/test_small/op9-200.jsonl
    - data/composition_hf/test_small/op10-200.jsonl
    - data/composition_hf/test_small/op11-200.jsonl
    - data/composition_hf/test_small/op12-200.jsonl
    - data/composition_hf/test_small/op13-200.jsonl
    - data/composition_hf/test_small/op14-200.jsonl
    - data/composition_hf/test_small/op17-200.jsonl
    - data/composition_hf/test_small/op18-200.jsonl
    - data/composition_hf/test_small/op19-200.jsonl
    - data/composition_hf/test_small/op20-200.jsonl
  tokenizer:
  train_batch_size: 1024  # Global batch size from paper
  max_prompt_length: 1024  # From paper
  max_response_length: 1024  # From paper
  id_max_op: 10
  filter_overlong_prompts: true
  truncation: error
  custom_cls:
    path: verl/dataset.py
    name: CustomRLHFDataset

custom_reward_function:
  path: verl/dataset.py
  name: compute_score

actor_rollout_ref:
  model:
    path: /fast/pmayilvahanan/Interplay-LM-Reasoning/LLaMA-Factory/saves/gsm_infinity/pt_op2-10_10B_alltemps_20260213_233838
    enable_gradient_checkpointing: true
    use_remove_padding: true
  actor:
    optim:
      lr: 1e-6  # From paper
    ppo_mini_batch_size: 256  # From paper
    ppo_micro_batch_size_per_gpu: 16  # From paper
    use_kl_loss: true
    kl_loss_coef: 0.001  # From paper (1e-3)
    kl_loss_type: low_var_kl  # Low-variance KL penalty from paper
    entropy_coeff: 0.0  # Zero entropy bonus from paper
    clip_ratio: 0.2
    loss_agg_mode: seq-mean-token-mean
    policy_loss:
      loss_mode: vanilla  # GRPO uses vanilla PPO loss with GRPO advantage
    fsdp_config:
      param_offload: false
      optimizer_offload: false
  rollout:
    name: vllm
    gpu_memory_utilization: 0.6
    n: 8  # Number of samples per prompt for GRPO
    tensor_model_parallel_size: 1
    log_prob_micro_batch_size_per_gpu: 16
    # RL rollout sampling params from paper: T=1.0, top_p=1.0, no top_k truncation
    temperature: 1.0
    top_p: 1.0
    top_k: -1
    # Validation sampling params from paper: T=0.7, top_p=1.0, no top_k
    val_kwargs:
      do_sample: true
      n: 128
      temperature: 0.7
      top_p: 1.0
      top_k: -1
  ref:
    log_prob_micro_batch_size_per_gpu: 16
    fsdp_config:
      param_offload: true

trainer:
  critic_warmup: 0
  logger:
    - console
    - wandb
    - local_json
  project_name: gsm-infinity-rl
  experiment_name: grpo_mgpo_id
  default_local_dir: results/gsm_infinity_rl/grpo_mgpo_id
  n_gpus_per_node: 8
  nnodes: 1
  save_freq: 20
  test_freq: 20
  log_val_generations: 100
  total_epochs: 2




